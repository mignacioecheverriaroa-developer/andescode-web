name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  build:
    name: Compilar sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Con dominio propio (variable del repo CUSTOM_DOMAIN) el sitio vive en la raíz;
      # sin él, en https://<usuario>.github.io/<repo>/.
      - name: Definir URL del sitio
        id: url
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "site_url=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "path_prefix=/" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
            echo "path_prefix=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        env:
          SITE_URL: ${{ steps.url.outputs.site_url }}
          PATH_PREFIX: ${{ steps.url.outputs.path_prefix }}
          FORMSPREE_ID: ${{ vars.FORMSPREE_ID }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: npm run build

      - name: Archivo CNAME
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
