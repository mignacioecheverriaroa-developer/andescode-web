<!--
  Firma HTML de AndesCode para Outlook.
  Cómo usarla: abre este archivo en el navegador, selecciona todo el bloque de la firma
  (Ctrl+A), cópialo (Ctrl+C) y pégalo en Outlook → Configuración → Correo → Redactar y responder → Firma.
  Usa tablas y estilos en línea porque los clientes de correo no admiten CSS externo.
  El logo se carga desde el sitio publicado; al cambiar al dominio propio, actualiza las URLs.
-->

    <title>Firma AndesCode</title>

    >
      <tr>
        <td style="padding: 0 0 10px 0">
          <a href="https://andescode.smartgridgroup.cl/" style="text-decoration: none">
            <img
              src="https://andescode.smartgridgroup.cl/assets/brand/andescode-firma.png"
              width="190"
              height="30"

              style="display: block; border: 0"

          <a href="https://andescode.smartgridgroup.cl/" style="color: #1f4e8c">andescode.smartgridgroup.cl</a
